name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # No `--with-deps`: ubuntu-latest already ships Chromium's system
      # libraries (Chrome is preinstalled), and the apt step it runs stalls on
      # the dpkg lock. The browser download itself intermittently hangs while
      # opening the connection for a secondary artifact (headless shell / ffmpeg)
      # with no output, so bound each attempt with `timeout` and retry — a fresh
      # connection clears the stall. On a cache hit the first attempt is a fast
      # no-op.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install (attempt $attempt)"
            timeout 180 npx playwright install chromium && { echo "::endgroup::"; exit 0; }
            echo "::endgroup::"
            echo "attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1
        timeout-minutes: 12

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
