name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    # Run inside Playwright's official image: Chromium and its system libraries
    # are preinstalled and pre-extracted, so we skip the `playwright install`
    # download+extract step that reliably stalled ~3 min on the bare runner
    # (Chrome downloaded to 100% in ~1s, then hung before extraction every run).
    # Pin this tag to the @playwright/test version in package.json (1.59.1) —
    # bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
